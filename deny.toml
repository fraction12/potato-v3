[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[advisories]
ignore = [
    # All transitive — no direct fix available until upstream deps update.
    "RUSTSEC-2024-0320", # yaml-rust unmaintained (syntect)
    "RUSTSEC-2024-0384", # instant unmaintained (transitive)
    "RUSTSEC-2025-0141", # bincode unmaintained (syntect)
    "RUSTSEC-2026-0009", # time stack exhaustion (plist→syntect, ratatui-widgets)
]

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
