project:
  name: Potato V3
  slug: potato-v3
  description: >
    Terminal cockpit for coding agents. Spawns Claude Code, Codex, or any CLI agent
    in a real PTY and wraps it in a unified metrics/session/observability TUI.
    Potato is not an agent — it's iTerm2 for the agent era.
  language: Rust
  framework: ratatui + tokio + crossterm + portable-pty + vt100
  storage: SQLite (rusqlite, WAL mode)
  current_phase: phase-8b-project

metadata:
  version: 0.1.0
  owner: Dushyant Garg
  status: active
  created_at: 2026-03-26
  updated_at: 2026-03-28

links:
  readme: ./README.md
  backlog: ./.openspec/backlog.yaml
  design_docs:
    prd: ~/Documents/Second Brain/Projects/Potato V3/PRD.md
    architecture: ~/Documents/Second Brain/Projects/Potato V3/ARCHITECTURE.md
    tui_design: ~/Documents/Second Brain/Projects/Potato V3/TUI-DESIGN.md
    research: ~/Documents/Second Brain/Projects/Potato V3/RESEARCH.md
    plan: ~/Documents/Second Brain/Projects/Potato V3/PLAN.md
    inter_session: ~/Documents/Second Brain/Projects/Potato V3/INTER-SESSION.md

key_decisions:
  - Potato spawns real agents in a PTY — no LLM API calls, no tool execution
  - Claude is source of truth for conversation; Potato is source of truth for observability
  - Sidebar metrics driven from Claude's native JSONL session logs, not synthetic estimates
  - Real embedded terminal viewport, not a rendered transcript
  - Dashboard-first launch → Enter to start cockpit session
  - Focus model: Input default → Tab cycles → Ctrl+J terminal → Esc returns
  - Inter-session communication via MCP server + PTY injection — infrastructure, not orchestration
  - Potato is the MCP server binary itself (potato mcp-server subcommand)

phases:
  - id: phase-1-foundation
    title: "Foundation: terminal setup, event loop, config, theme"
    status: done
    goal: Bootable TUI with panic hook, async event loop, config, earth-tone theme.

  - id: phase-2-pty
    title: "Claude Code PTY integration"
    status: done
    goal: >
      Real PTY embedding via portable-pty + vt100 + tui-term.
      Claude launched with --session-id. Input routing through Potato.
      Independent terminal scrollback.

  - id: phase-3-cockpit
    title: "Cockpit layout + focus system"
    status: done
    goal: >
      3-column layout (sessions rail | terminal + input | sidebar).
      Focus ring with Tab/Ctrl+J/Esc. Status bar. PTY resize tracking.

  - id: phase-4-observability
    title: "Native Claude observability from JSONL"
    status: done
    goal: >
      Claude JSONL session log tailer. Sidebar with live metrics, tools,
      tokens, stop reason. Correct project-dir naming. PTY cwd binding.

  - id: phase-5-sessions
    title: "Session recording + left rail + multi-pane"
    status: done
    goal: >
      SQLite persistence of session events. Left rail with session history
      and resume. Multi-pane support (up to 2 Claude sessions side-by-side).
      Tab focus cycling across panes. Agents picker in left rail.
    tickets: [T-501, T-502, T-503, T-505, T-506, T-507]

  - id: phase-6-commands
    title: "Slash commands + overlays"
    status: in-progress
    goal: >
      /new, /sessions, /export, /help, /agent. Autocomplete dropdown.
      Help overlay with keybind reference.
    tickets: [T-504, T-601, T-602, T-603]

  - id: phase-7-inter-session
    title: "Inter-session communication via MCP"
    status: done
    goal: >
      Potato MCP server that both Claude panes connect to. Enables real-time
      messaging, shared context, task coordination, and role assignment between
      sessions. MCP tools + PTY injection for push notifications.
    tickets: [T-700, T-700b, T-701, T-702, T-703, T-704, T-705, T-706, T-707, T-708, T-709, T-710, T-711]

  - id: phase-8-multiagent
    title: "Multi-agent support"
    status: done
    goal: >
      Codex adapter, GenericAdapter for arbitrary CLIs, agent picker,
      agent profiles in config, project-level .potato/profile.toml.
    tickets: [T-801, T-802, T-803, T-804]

  - id: phase-8b-project
    title: "Project-aware state + agent roster"
    status: planned
    goal: >
      Per-project SQLite persistence for coordination state (.potato/state.db)
      and project-scoped agent configuration (.potato/agents.toml).
    tickets: [T-811, T-812]

  - id: phase-8c-sidebar
    title: "Sidebar redesign (coordination observatory)"
    status: planned
    goal: >
      Replace single-session diagnostics sidebar with coordination-first layout:
      agent roles + status, inter-agent activity feed, compact active-pane metrics.
    tickets: [T-810]

  - id: phase-8d-left-rail
    title: "Left rail redesign (project panel)"
    status: planned
    goal: >
      Replace sessions list with project-oriented left rail: agent roster from
      config + live task board from MCP coordination state.
    tickets: [T-820]

  - id: phase-9-release
    title: "Polish + distribution"
    status: planned
    goal: >
      Error handling, responsive layouts, compact mode, performance,
      cargo install / Homebrew, README with GIFs, CI/CD, cross-compilation.
    tickets: [T-901, T-902, T-903, T-904]
