      Autocomplete dropdown above input. Built-in: /new, /sessions,
      /export, /help, /agent.
    acceptance:
      - / triggers command mode
      - Autocomplete shows matching commands
      - Tab to complete, Enter to execute
      - Esc cancels command mode

  - id: T-602
