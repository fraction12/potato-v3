      ? toggles full-screen keybind reference overlay.
      Sections: Global, Input, Terminal, Navigation.
      Dismisses with Esc or ?.
    acceptance:
      - All keybinds documented
      - Overlay renders correctly at any terminal size
      - Keybinds match actual behavior

  - id: T-603
    title: "Session picker overlay"
    status: open
    phase: phase-6-commands
    description: |
      /sessions opens modal session picker. Shows all sessions with
      title, date, tokens. Search/filter, Enter to switch, Esc to cancel.
    acceptance:
      - Lists all persisted sessions
      - Filter by typing
      - Switching sessions tears down current PTY and launches new one

