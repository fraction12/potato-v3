  # ─── Phase 5 — Session Recording + Left Rail ─────────────────────────────────

  - id: T-501
    title: "SQLite session recording from JSONL events"
    status: open
    phase: phase-5-sessions
    description: |
      Record Claude JSONL events into Potato's SQLite store as they arrive.
      Schema: sessions (id, agent, model, cwd, title, created_at, updated_at,
      total_tokens) + events (session_id, event_type, payload JSON, timestamp).
      Title derived from first user prompt. Auto-save on each new event.
    acceptance:
      - Events from claude_log tailer are persisted to SQLite
      - Session metadata (model, cwd, tokens) tracked
      - Title auto-generated from first user prompt
      - WAL mode, no write contention with UI reads

  - id: T-502
    title: "Left rail — session list from Claude history"
    status: open
    phase: phase-5-sessions
    description: |
      Populate left rail from ~/.claude/projects/ JSONL files + Potato SQLite.
      Show: truncated title, date, token count, agent name.
      Navigate with j/k, Enter to select. Active session highlighted.
    acceptance:
      - Left rail shows real session history
      - Sessions sorted by recency
      - Active session visually distinct
      - Navigation works when Sessions panel is focused

  - id: T-503
    title: "Session resume (--session / --continue)"
    status: open
    phase: phase-5-sessions
    description: |
      potato --session <id> or potato --continue launches Claude with
      --session-id <id> --continue. Historical events loaded from SQLite
      into sidebar on resume.
    acceptance:
      - --session flag resumes a specific session
      - --continue resumes last session
      - Sidebar shows historical metrics on resume
      - Claude picks up conversation where it left off

  - id: T-504
    title: "Session export (/export md|json|timeline)"
    status: open
    phase: phase-5-sessions
    description: |
      Slash commands to export current session. /export md produces a
      readable markdown transcript. /export json dumps raw events.
      /export timeline produces a tool-call summary.
    acceptance:
      - /export md produces readable markdown
      - /export json dumps all events
      - /export timeline shows tool calls with durations
      - Output written to cwd with session-id filename

  # ─── Phase 6 — Slash Commands + Overlays ──────────────────────────────────────

  - id: T-601
