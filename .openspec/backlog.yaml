tasks:
  - id: T-001
    title: "Terminal setup + panic hook"
    status: done
    phase: phase-1-foundation
    description: |
      Crossterm backend init, raw mode RAII guard, alternate screen,
      panic hook that restores terminal before printing backtrace,
      SIGINT/SIGTERM graceful restore. Smoke test: launch → splash → quit.
    acceptance:
      - Raw mode entered on start, restored on any exit path
      - Alternate screen used
      - Panic hook restores terminal before printing panic
      - Ctrl+C exits cleanly

  - id: T-002
    title: "Async event loop + tick system"
    status: done
    phase: phase-1-foundation
    description: |
      tokio runtime, crossterm EventStream in dedicated task,
      central Message enum (Key, Resize, Tick, Agent, Quit),
      mpsc channels, render loop with tick throttle, graceful shutdown.
    acceptance:
      - App runs async event loop
      - Key events and resize events processed
      - Tick-based render throttling
      - Clean shutdown drains events

  - id: T-003
    title: "Config loading + schema"
    status: done
    phase: phase-1-foundation
    description: |
      Load ~/.potato/config.toml via serde+toml. Schema includes
      ollama_url, default_model, theme, keybinds, data_dir.
      Default impl with sensible fallbacks. Create ~/.potato/ on first run.
    acceptance:
      - Config loads from file or falls back to defaults
      - ~/.potato/ created if missing
      - Validation errors are user-friendly

  - id: T-004
    title: "Theme system with earth-tone palette"
    status: done
    phase: phase-1-foundation
    description: |
      Theme struct with Tan, Brown, Soil, Sprout, Rust, Amber, Cream,
      Charcoal, BG constants. Style helpers for roles, borders, status.
    acceptance:
      - All 9 palette colors defined as RGB constants
      - Style helpers for message roles and UI elements

  - id: T-005
    title: "Basic chat panel + input box"
    status: open
    phase: phase-1-foundation
    description: |
      ChatPanel rendering Vec<ChatMessage> with role colors and prefixes.
      Scrollback with j/k or mouse wheel. Input box at bottom with
      line editing. Submit on Enter. User prompt prefix ❯.
    acceptance:
      - Messages render with role-based colors
      - Scrollback works via keyboard
      - Input accepts typing, backspace, cursor movement
      - Enter submits message
      - User messages show ❯ prefix

  - id: T-006
    title: "Ollama client + streaming"
    status: open
    phase: phase-1-foundation
    description: |
      reqwest client with NDJSON streaming to POST /api/chat.
      Parse chunks, forward via mpsc as AgentChunk messages.
      Handle done sentinel. Connection error → retry once → surface error.
      Model list via GET /api/tags.
    acceptance:
      - Streaming response appears token-by-token in chat
      - Connection errors surface as chat messages
      - Model list endpoint works

  - id: T-007
    title: "Tool trait + registry + builtin tools"
    status: open
    phase: phase-1-foundation
    description: |
      Tool trait (name, description, parameters, execute). ToolRegistry
      for register/lookup. Builtin tools: shell, read_file, write_file,
      edit_file, search (grep), list_dir. Async execution with timeout.
    acceptance:
      - Tool trait is generic and extensible
      - All 6 builtin tools registered
      - Executor respects timeouts
      - Tool results flow back to agent loop

  - id: T-008
    title: "Agent loop + state machine"
    status: open
    phase: phase-1-foundation
    description: |
      Agent loop: receive user message → call LLM → process response →
      if tool call, execute tool → feed result back → repeat until done.
      AgentState FSM: Idle → Thinking → ToolCall → Approval → back.
      StreamAccumulator for token accumulation.
    acceptance:
      - Full agent loop with tool calling works
      - State machine transitions are correct
      - Streaming tokens accumulate properly

  - id: T-009
    title: "Approval gate for tool execution"
    status: open
    phase: phase-1-foundation
    description: |
      Tool calls require approval before execution (configurable).
      ApprovalBar shows y/n/a inline. Agent loop pauses at approval.
      'a' approves all remaining in current turn.
    acceptance:
      - Tool calls pause for approval
      - y approves, n denies, a approves all
      - Denied tools surface denial to agent

  - id: T-010
    title: "Session persistence (SQLite)"
    status: open
    phase: phase-1-foundation
    description: |
      SQLite-backed session store with rusqlite. Sessions table,
      messages table. Save/load conversation history. WAL mode.
      MessageHistory manages in-memory + persistence.
    acceptance:
      - Sessions persist across restarts
      - Messages stored with role, content, timestamp, tokens
      - WAL mode enabled
      - Session list/switch works
