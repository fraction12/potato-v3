  # ─── Phase 8b — Project-Aware State ───────────────────────────────────────────

  - id: T-811
    title: "Per-project state persistence (.potato/state.db)"
    status: open
    phase: phase-8b-project
    description: |
      Shift coordination state from in-memory (dies on exit) to per-project
      SQLite at `.potato/state.db`. On launch, Potato checks cwd for
      `.potato/` and hydrates InterSessionState from it. On exit (or
      periodically), flush back.

      Persisted state:
      - Roles (pane role assignments)
      - Messages (inter-agent message history)
      - Shared context (KV store)
      - Task board (claims, status, history)

      If no `.potato/` exists, fall back to current in-memory-only behavior.
      Creating `.potato/` is manual for now (no `potato init` yet).
    acceptance:
      - .potato/state.db created on first coordination action if .potato/ exists
      - Roles, messages, shared context, tasks survive between sessions
      - Hydrated on launch — agents see prior state via MCP tools
      - Graceful fallback to in-memory when no .potato/ directory
      - WAL mode, no contention with UI reads

  - id: T-812
    title: "Project-scoped agent roster (.potato/agents.toml)"
    status: open
    phase: phase-8b-project
    description: |
      Per-project agent configuration at `.potato/agents.toml`. Defines
      which agents are available in this project, their roles, default
      models, extra args, and env overrides.

      Load order: auto-detected defaults < global profiles < .potato/agents.toml.
      This replaces global-only ProfileLoader for repos that define it.

      Example:
      ```toml
      [[agents]]
      name = "architect"
      adapter = "claude"
      model = "sonnet"
      extra_args = ["--permission-mode", "bypassPermissions"]

      [[agents]]
      name = "implementer"
      adapter = "claude"
      extra_args = ["--permission-mode", "bypassPermissions"]
      ```
    acceptance:
      - .potato/agents.toml loaded on launch if present
      - Overrides global profiles for matching agents
      - Left rail shows project-scoped agents
      - Agents launched with project-specific config
      - Missing file falls back to global profiles

  # ─── Phase 8c — Sidebar Redesign (Coordination Observatory) ──────────────────

  - id: T-810
    title: "Sidebar redesign: coordination observatory"
    status: open
    phase: phase-8b-sidebar
    description: |
      Replace the current single-session diagnostics sidebar with a
      coordination-first layout. The sidebar should answer "what's happening
      between my agents?" not "how many tokens did pane 0 use?"

      Three sections, top to bottom:

      **Coordination (top)** — Both agents' roles + live status
      (idle/thinking/tool use). At-a-glance system state, not just focused pane.
      Shows who's talking to whom.

      **Activity Feed (middle, flex)** — Chronological feed of inter-agent
      events: MCP messages sent/received, task claims/releases, shared context
      updates, role changes. This is the collaboration timeline — the most
      important section for multi-agent use.

      **Active Pane (bottom, compact)** — Compressed 3-4 line metrics for the
      focused pane: model, turns, tokens. Useful but not the star.

      When only one pane is active (no collaboration), degrade gracefully:
      coordination section shows single agent status, activity feed shows
      tool calls from the active pane, bottom stays the same.
    acceptance:
      - Coordination section shows all panes' roles + live status
      - Activity feed shows inter-agent messages, task claims, context updates
      - Feed is chronological, scrollable, auto-tails new events
      - Active pane metrics compressed to 3-4 lines
      - Single-pane mode degrades gracefully (no empty sections)
      - Feed entries attributed with source pane/role and timestamp

