[package]
name = "potato"
version = "0.1.0"
edition = "2024"
description = "Terminal-native AI agent orchestration desktop"
license = "MIT"
repository = "https://github.com/pземлянka/potato"
rust-version = "1.85"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
syntect = "5"
unicode-width = "0.2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }
nucleo-matcher = "0.3"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tokio-stream = "0.1"
async-trait = "0.1"

[profile.release]
lto = true
strip = true
codegen-units = 1
