[package]
name = "potato"
version = "0.1.0"
edition = "2024"
description = "Terminal cockpit for external coding agents"
license = "MIT"
repository = "https://github.com/pzemlyanuka/potato"
rust-version = "1.86"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
notify = { version = "7", default-features = false, features = ["macos_kqueue"] }
# T-905: PollWatcher is exposed from notify's core — no extra feature needed.
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
syntect = "5"
unicode-width = "0.2.1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
libc = "0.2"
clap = { version = "4", features = ["derive"] }
nucleo-matcher = "0.3"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tokio-stream = "0.1"
async-trait = "0.1"
which = "6"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9.0"
vt100 = "=0.16.2"
tui-term = "0.3.2"

[profile.release]
lto = true
strip = true
codegen-units = 1

[dev-dependencies]
tempfile = "3.27.0"
