# Potato default configuration
# Copy to ~/.potato/config.toml and adjust as needed.

# ── Agent ─────────────────────────────────────────────────────────────────────

# Default agent to launch when pressing Enter on the dashboard.
# Options: "claude", "codex"
default_agent = "claude"

# ── Session storage ───────────────────────────────────────────────────────────

# Path to the SQLite session database.
db_path = "~/.potato/sessions.db"

# ── UI ────────────────────────────────────────────────────────────────────────

# Tick rate in milliseconds (controls animation and polling speed).
tick_rate_ms = 250

# Active theme name.
theme = "earth"

# ── Keybinds ──────────────────────────────────────────────────────────────────

[keybinds]
quit         = "ctrl+q"
submit       = "enter"
slash_menu   = "/"
model_picker = "ctrl+m"
help         = "?"
approve      = "y"
deny         = "n"
new_session  = "ctrl+n"
